<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>耆康黃色小巴遊社區 - 填色上載系統</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fcf8f2;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h1 {
            color: #d97706;
            font-size: 24px;
            border-bottom: 2px solid #fef3c7;
            padding-bottom: 10px;
        }
        .section {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #fafafa;
        }
        .btn {
            background-color: #f59e0b;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #d97706;
        }
        /* 統一預設小巴與上載小巴的尺寸與對齊設定 */
        .minibus-container {
            width: 320px;
            height: 160px;
            margin: 15px auto;
            position: relative;
            border: 2px dashed #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            overflow: hidden;
            border-radius: 8px;
        }
        .minibus-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* 自動去除白色背景，讓填色作品完美融入線條 */
            mix-blend-mode: multiply;
        }
        .template-preview {
            display: block;
            margin: 15px auto;
            max-width: 100%;
            height: auto;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            background: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚌 耆康黃色小巴遊社區 - 填色上載系統</h1>
    
    <!-- 1. 下載以系統小巴為藍圖的填色範本 -->
    <div class="section">
        <h3>1. 下載標準小巴填色範本（以系統預設小巴為藍圖）</h3>
        <p>點擊下方按鈕可直接下載與畫面小巴外型完全一致的高清黑白線稿，列印後即可進行填色：</p>
        <a href="#" class="btn" onclick="downloadSystemTemplate(event)">📥 下載系統小巴填色藍圖</a>
        <canvas id="hiddenCanvas" style="display:none;"></canvas>
    </div>

    <!-- 2. 上載填色作品 -->
    <div class="section">
        <h3>2. 上載填色後的小巴照片</h3>
        <p>拍攝填色作品並上載，系統將自動去背並調整至與畫面預設完全一致的尺寸：</p>
        <input type="file" id="uploadInput" accept="image/*" onchange="previewImage(event)">
        
        <div class="minibus-container">
            <img id="preview" class="minibus-img" src="" alt="請上載填色小巴圖片" style="display:none;">
            <span id="placeholderText" style="color: #9ca3af; font-size: 14px;">預覽小巴畫面</span>
        </div>
    </div>
</div>

<script>
    // 生成精準對應系統藍圖的小巴線稿圖檔供下載列印
    function downloadSystemTemplate(e) {
        e.preventDefault();
        const canvas = document.getElementById('hiddenCanvas');
        canvas.width = 1000;
        canvas.height = 500;
        const ctx = canvas.getContext('2d');

        // 純白背景
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 設定線條樣式（乾淨、專業的黑白線稿）
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 5;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        // 1. 車頂路牌箱
        ctx.strokeRect(350, 80, 300, 90);
        ctx.font = 'bold 24px sans-serif';
        ctx.fillStyle = '#000000';
        ctx.textAlign = 'center';
        ctx.fillText('【 紅磡站 - 旺角 】 16座位', 500, 135);

        // 2. 車身主體輪廓
        ctx.beginPath();
        ctx.roundRect(150, 170, 700, 220, [20, 40, 10, 10]);
        ctx.stroke();

        // 3. 車窗群
        ctx.strokeRect(200, 200, 130, 110); // 前窗
        ctx.strokeRect(350, 200, 130, 110); // 中窗
        ctx.strokeRect(500, 200, 280, 110); // 後長窗

        // 4. 車輪
        ctx.beginPath();
        ctx.arc(300, 410, 45, 0, Math.PI * 2);
        ctx.arc(700, 410, 45, 0, Math.PI * 2);
        ctx.stroke();

        // 觸發下載
        const link = document.createElement('a');
        link.download = 'sage_minibus_coloring_blueprint.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    // 預覽上載圖片並自動去背、對齊尺寸
    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const imgElement = document.getElementById('preview');
                const placeholder = document.getElementById('placeholderText');
                imgElement.src = e.target.result;
                imgElement.style.display = 'block';
                placeholder.style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
    }
</script>

</body>
</html>

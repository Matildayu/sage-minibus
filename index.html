<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>耆康黃色小巴遊社區 - Z形互動系統</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fcf8f2;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h1 {
            color: #d97706;
            font-size: 24px;
            border-bottom: 2px solid #fef3c7;
            padding-bottom: 10px;
        }
        .section {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #fafafa;
        }
        .btn {
            background-color: #f59e0b;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #d97706;
        }
        /* 系統預設小巴尺寸與上載小巴統一設定：保持與畫面一致 */
        .minibus-container {
            width: 300px;
            height: 150px;
            margin: 15px auto;
            position: relative;
            border: 2px dashed #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            overflow: hidden;
            border-radius: 8px;
        }
        .minibus-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* 關鍵：自動濾除白色背景（Multiply 模式可將白色轉為透明或融合） */
            mix-blend-mode: multiply;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚌 耆康黃色小巴遊社區 - 填色上載系統</h1>
    
    <!-- 下載填色範本專區 -->
    <div class="section">
        <h3>1. 下載填色範本（供列印填色）</h3>
        <p>請點擊下方按鈕下載標準小巴黑白線稿範本，列印後即可給小朋友或長者填色：</p>
        <a href="#" class="btn" id="downloadTemplateBtn" onclick="downloadTemplate(event)">📥 下載小巴填色範本</a>
        <canvas id="templateCanvas" style="display:none;"></canvas>
    </div>

    <!-- 上載填色後的小巴 -->
    <div class="section">
        <h3>2. 上載填色後的小巴照片</h3>
        <p>拍攝填色作品並上載，系統將自動去背並調整至標準小巴尺寸：</p>
        <input type="file" id="uploadInput" accept="image/*" onchange="previewImage(event)">
        
        <div class="minibus-container">
            <!-- 預設或上載的小巴顯示區域 -->
            <img id="preview" class="minibus-img" src="" alt="請上載填色小巴圖片" style="display:none;">
            <span id="placeholderText" style="color: #9ca3af; font-size: 14px;">預覽小巴畫面</span>
        </div>
    </div>
</div>

<script>
    // 自動生成並下載填色範本圖片的函數
    function downloadTemplate(e) {
        e.preventDefault();
        const canvas = document.getElementById('templateCanvas');
        canvas.width = 800;
        canvas.height = 400;
        const ctx = canvas.getContext('2d');

        // 繪製白色背景
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 繪製小巴線稿圖形（經典香港小巴輪廓）
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 4;
        ctx.lineJoin = 'round';

        // 車身外框
        ctx.strokeRect(150, 120, 520, 200);
        
        // 車頭路牌箱
        ctx.strokeRect(280, 50, 260, 70);
        ctx.font = 'bold 20px sans-serif';
        ctx.fillStyle = '#000';
        ctx.fillText('【 紅磡站 - 旺角 】16座位', 290, 95);

        // 車窗
        ctx.strokeRect(180, 150, 100, 90);
        ctx.strokeRect(300, 150, 100, 90);
        ctx.strokeRect(420, 150, 160, 90);

        // 車輪
        ctx.beginPath();
        ctx.arc(260, 320, 35, 0, Math.PI * 2);
        ctx.arc(580, 320, 35, 0, Math.PI * 2);
        ctx.stroke();

        // 觸發下載
        const link = document.createElement('a');
        link.download = 'minibus_coloring_template.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    // 處理圖片上載、自動去背與統一尺寸預覽
    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const imgElement = document.getElementById('preview');
                const placeholder = document.getElementById('placeholderText');
                imgElement.src = e.target.result;
                imgElement.style.display = 'block';
                placeholder.style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
    }
</script>

</body>
</html>
